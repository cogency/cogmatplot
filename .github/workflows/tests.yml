name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests are headless (Agg and inline). PyVista and PyQt5 are left out:
      # a runner has no OpenGL for VTK, and inline 3D falls back to matplotlib.
      - run: python -m pip install numpy matplotlib matplotlib-inline pyzmq screeninfo opencv-python-headless
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
